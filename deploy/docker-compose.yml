# Always-on izumi-ops services that are read-only / in-process (safe to containerise).
# The Telegram ops bot is NOT here — it runs on the host (see deploy/run-bot.sh)
# because it spawns `docker run` with host paths.
#
# Usage (from the repo root on Unraid):
#   docker compose -f deploy/docker-compose.yml up -d
# The image is the one the menu builds (izumi-organizer:local).

services:
  webui:
    image: izumi-organizer:local
    container_name: izumi-webui
    restart: unless-stopped
    working_dir: /app
    command: ["python", "webui.py", "--dir", "/reports", "--port", "8888"]
    ports:
      - "8888:8888"
    volumes:
      - "..:/app:ro"
      # Point this at your reporting.dir (config/config.json reporting.dir):
      - "/mnt/cache/appdata/izumi-ops/reports:/reports:ro"
