# pipelines.yaml — named module sequences for `python run.py <pipeline>`
#
# Each pipeline is an ordered list of modules. Modules never import each other;
# the pipeline is the only place their order is expressed. All modules honour
# DRY_RUN, so a pipeline is safe to dry-run end to end:
#   python run.py organize-manuales --dry-run

pipelines:
  # Tidy the unsorted "manuales" dump after the dedupe pass:
  #   1. plex_dupefinder — remove duplicates first (quarantine, reversible)
  #   2. organizer       — quarantine junk + AI-identify + (opt-in) relocate
  #
  # organizer is safe-by-default: CLEANUP quarantines junk (honours DRY_RUN),
  # IDENTIFY is read-only (Gemini), APPLY (relocate) is report-only until
  # integrations.gemini.apply is set true after a parity window.
  organize-manuales:
    - plex_dupefinder
    - organizer

  # Read-only health sweep (all need only the docker socket). SMART disk health
  # (diskwatch) is intentionally NOT here — it needs a privileged container with
  # /dev mounted, so run it separately. Safe to dry-run end to end.
  health:
    - uptime
    - dbcheck
    - permsdoctor
    - backupaudit
    - netdoctor

  # Hourly cron: refresh EVERY health card the panel shows, prune the metrics
  # store (growth control), regenerate the dashboard, then push to Telegram ONLY
  # if something is failing (notify.level=fail suppresses the no-news case). Run
  # with IZUMI_MODE=live so the prune + the conditional push actually happen.
  # diskwatch is intentionally NOT here — it needs a privileged container; this
  # pipeline only needs the docker socket.
  hourly:
    - uptime
    - dbcheck
    - permsdoctor
    - backupaudit
    - netdoctor
    - configcheck
    - capacitydoctor
    - certdoctor
    - status
    - retention
    - metricsexport
    - webdashboard
    - notifypush

  # Nightly cron: run the read-only sweep, then push the consolidated digest to
  # Telegram. Run with IZUMI_MODE=live (+ notify.enabled) so notifypush sends:
  #   docker run --rm -e IZUMI_MODE=live -v /var/run/docker.sock:/var/run/docker.sock \
  #     -v "$REPO:/app" -v /mnt/user:/mnt/user -v /mnt/cache:/mnt/cache -w /app \
  #     izumi-organizer:local python run.py nightly
  nightly:
    - uptime
    - dbcheck
    - permsdoctor
    - backupaudit
    - netdoctor
    - notifypush
